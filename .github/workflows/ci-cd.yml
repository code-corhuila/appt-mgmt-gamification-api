name: Salud Activa CI/CD Pipeline (Corte 3)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - qa

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRO: ghcr.io

jobs:
  pruebas:
    name: 1 · Pruebas Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Test Suite (25 Tests / 7 Suites)
        working-directory: backend
        run: npm test

  docker-y-seguridad:
    name: 2 · Docker, Trivy y GHCR
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Validate Local Compose File
        run: docker compose -f compose.yml config --quiet

      - name: Validate Production Compose File
        run: docker compose -f compose.prod.yml config --quiet

      - name: Lowercase Repository Name
        id: repo
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Build API Gateway Image
        run: |
          docker build -t salud-activa-gateway:${{ github.sha }} ./backend

      - name: DevSecOps · Escaneo de vulnerabilidades Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --quiet --exit-code 0 --severity CRITICAL,HIGH --ignore-unfixed \
            salud-activa-gateway:${{ github.sha }}

      - name: Publicar en GHCR (Solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRO} -u ${{ github.actor }} --password-stdin
          TAG_BASE="${REGISTRO}/${{ steps.repo.outputs.repo_lower }}/backend"
          docker tag salud-activa-gateway:${{ github.sha }} ${TAG_BASE}:latest
          docker tag salud-activa-gateway:${{ github.sha }} ${TAG_BASE}:${{ github.sha }}
          docker push ${TAG_BASE}:latest
          docker push ${TAG_BASE}:${{ github.sha }}
