name: Salud Activa CI/CD Pipeline (Corte 3)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - qa

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: 🧪 Run Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Test Suite (25 Tests / 7 Suites)
        working-directory: backend
        run: npm test

  validate-docker:
    name: 🐳 Validate Docker Compose Stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Validate Local Compose File
        run: docker compose -f compose.yml config --quiet

      - name: Validate Production Compose File
        run: docker compose -f compose.prod.yml config --quiet

      - name: Build Local Docker Stack
        run: docker compose -f compose.yml build

  security-scan:
    name: 🛡️ Security Vulnerability Scan (Trivy)
    needs: [test-backend, validate-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build API Gateway Image
        run: docker build -t salud-activa-gateway:latest ./backend

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'salud-activa-gateway:latest'
          format: 'table'
          exit-code: '0' # Non-blocking security warnings
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  publish-ghcr:
    name: 📦 Publish Container Images to GHCR
    needs: [security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
