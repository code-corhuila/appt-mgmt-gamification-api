name: Salud Activa CI/CD Pipeline (Corte 3)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - qa

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: 1 · Pruebas Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Test Suite (25 Tests / 7 Suites)
        working-directory: backend
        run: npm test

  docker-build:
    name: 2 · Construcción y Validación Docker Compose
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Validate Local Compose File
        run: docker compose -f compose.yml config --quiet

      - name: Validate Production Compose File
        run: docker compose -f compose.prod.yml config --quiet

      - name: Build Docker Compose Stack
        run: docker compose -f compose.yml build
