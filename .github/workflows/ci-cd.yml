# Pipeline CI/CD de Salud Activa (Corte 3 - CORHUILA)
# Basado en la especificación oficial de la presentación Pipeline_CICD_BiblioHuila.pptx
#
# Etapas:
#   1. Pruebas Backend (npm test)
#   2. Imágenes + Seguridad (Trivy) + Publicar en GHCR (solo main)
#   3. Desplegar en EC2 (detrás del interruptor vars.DESPLEGAR_EC2 == 'si')

name: CI-CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop, qa]

permissions:
  contents: read
  packages: write

env:
  REGISTRO: ghcr.io

jobs:
  pruebas:
    name: 1 · Pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (25 Tests / 7 Suites)
        run: npm test

  imagenes:
    name: 2 · Imágenes + Seguridad
    needs: pruebas
    runs-on: ubuntu-latest
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Validate Compose Files
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.prod.yml config --quiet

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: nombre
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "imagen=${REGISTRO}/${REPO_LOWER}/backend" >> "$GITHUB_OUTPUT"

      - name: Construir Imagen Docker
        run: |
          ORIGEN="org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          docker build -t ${{ steps.nombre.outputs.imagen }}:${{ github.sha }} --label "$ORIGEN" ./backend

      - name: DevSecOps · Escaneo de vulnerabilidades Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: '${{ steps.nombre.outputs.imagen }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Publicar en GHCR (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRO} -u ${{ github.actor }} --password-stdin
          docker tag ${{ steps.nombre.outputs.imagen }}:${{ github.sha }} ${{ steps.nombre.outputs.imagen }}:latest
          docker push ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
          docker push ${{ steps.nombre.outputs.imagen }}:latest

  desplegar:
    name: 3 · Desplegar en EC2
    needs: imagenes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DESPLEGAR_EC2 == 'si'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Simular o Ejecutar Despliegue
        run: echo "Despliegue activado mediante variable DESPLEGAR_EC2=si"
