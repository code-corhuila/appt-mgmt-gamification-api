groups:
  - name: appointments_service_slo_alerts
    rules:
      - alert: AppointmentServiceFastBurnErrorBudget
        expr: |
          (
            sum(rate(appointment_requests_failed_total{route="/api/turnos"}[5m]))
            /
            sum(rate(appointment_requests_total{route="/api/turnos"}[5m]))
          ) > (14.4 * 0.005)
          and
          (
            sum(rate(appointment_requests_failed_total{route="/api/turnos"}[1h]))
            /
            sum(rate(appointment_requests_total{route="/api/turnos"}[1h]))
          ) > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
          team: salud-activa
          service: appointments-service
        annotations:
          summary: "Fast burn rate detected on appointments-service availability SLO"
          description: "High error rate spending 2% of monthly error budget within 1 hour (Burn Rate 14.4)."
          runbook_url: "https://github.com/BrayanYara1/ProyectoDistribuidos2026/blob/main/11-week/workshop/07-runbook.md"

      - alert: AppointmentServiceSlowBurnErrorBudget
        expr: |
          (
            sum(rate(appointment_requests_failed_total{route="/api/turnos"}[30m]))
            /
            sum(rate(appointment_requests_total{route="/api/turnos"}[30m]))
          ) > (6.0 * 0.005)
          and
          (
            sum(rate(appointment_requests_failed_total{route="/api/turnos"}[6h]))
            /
            sum(rate(appointment_requests_total{route="/api/turnos"}[6h]))
          ) > (6.0 * 0.005)
        for: 15m
        labels:
          severity: warning
          team: salud-activa
          service: appointments-service
        annotations:
          summary: "Slow burn rate detected on appointments-service availability SLO"
          description: "Sustained error rate spending 5% of monthly error budget within 6 hours (Burn Rate 6.0)."
          runbook_url: "https://github.com/BrayanYara1/ProyectoDistribuidos2026/blob/main/11-week/workshop/07-runbook.md"
